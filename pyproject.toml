[project]
name = "grid2poster"
version = "0.1.0"
description = "Print-ready electrical transmission grid posters from OpenStreetMap power data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Tobias Augspurger" }]
maintainers = [{ name = "Open Energy Transition" }]
keywords = ["openstreetmap", "power-grid", "poster", "cartography", "matplotlib"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "geopandas>=1.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "osmnx>=2.0",
    "pandas>=2.0",
    "requests>=2.31",
    "shapely>=2.0",
    "tqdm>=4.66",
    "typer>=0.15",
]

[project.urls]
Homepage = "https://open-energy-transition.github.io/grid2poster/"
Repository = "https://github.com/open-energy-transition/grid2poster"

[project.scripts]
grid2poster = "grid2poster.cli:run"

[dependency-groups]
dev = ["ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grid2poster"]

[tool.hatch.build.targets.sdist]
include = ["src/grid2poster", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # long lines are handled by the formatter
    "B008",    # typer.Option() in defaults is the documented Typer idiom
    "RUF001",  # the CLI and poster copy use typographic characters on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.format]
docstring-code-format = true
